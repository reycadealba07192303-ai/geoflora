# Continuous integration for GeoFlora.
# CD: Vercel's Git integration deploys apps/web on its own: every push to main goes to production
# (https://geoflora-ph.vercel.app) and every pull request gets a preview link. This workflow checks each push and
# pull request; open a pull request and wait for a green check before merging to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (typecheck + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Models present for the in-app classifier
        run: |
          test -f models/ensemble.json
          node -e "const c=require('./models/ensemble.json');const fs=require('fs');for(const m of [...c.members,c.confirm].filter(Boolean)){if(!fs.existsSync('models/'+m+'/model.onnx'))throw Error('missing '+m);}console.log('ensemble ok:',c.version)"

  ml-lab:
    name: ML lab tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-lab/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and pipeline tests (synthetic data, no network)
        run: python -m pytest -q -m "not slow"
