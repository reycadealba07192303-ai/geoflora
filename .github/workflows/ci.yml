# CI/CD for GeoFlora.
# CI: every push and pull request runs the web typecheck + production build and the ML lab tests.
# CD: after CI passes on main, the "Deploy to production" job builds and deploys apps/web to Vercel
#     (https://geoflora-ph.vercel.app). It needs three repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID and
#     VERCEL_PROJECT_ID (Settings -> Secrets and variables -> Actions). Without them the job is skipped and
#     Vercel's own Git integration keeps deploying. Pull requests get preview links from Vercel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (typecheck + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Models present for the in-app classifier
        run: |
          test -f models/ensemble.json
          node -e "const c=require('./models/ensemble.json');const fs=require('fs');for(const m of [...c.members,c.confirm].filter(Boolean)){if(!fs.existsSync('models/'+m+'/model.onnx'))throw Error('missing '+m);}console.log('ensemble ok:',c.version)"

  ml-lab:
    name: ML lab tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-lab/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and pipeline tests (synthetic data, no network)
        run: python -m pytest -q -m "not slow"

  deploy:
    name: Deploy to production (Vercel)
    needs: [web, ml-lab]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://geoflora-ph.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Vercel secrets are not set; skipping (Vercel's Git integration deploys instead)."; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          curl -fsS https://geoflora-ph.vercel.app/api/identify | head -c 200

