# Cloud training for GeoFlora: runs on GitHub's servers, so the developer's laptop does not need to be on.
# Every 30 minutes a quick pass (no TensorFlow) imports newly approved/corrected report photos and activates
# models an administrator approved. When 20 new photos are waiting, the same run retrains the model (about
# 1.5-2 hours), evaluates it against the live model and offers it under Review & training -> "Approve new model".
# Changes (new photos' records, activated models) are committed to main; Vercel then deploys the app.
# Needs the repository secret GEOFLORA_MONGODB_URI (the MongoDB Atlas connection string). Without it, it skips.
name: Cloud training

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      min_new:
        description: "New report photos needed to retrain"
        default: "20"

concurrency:
  group: cloud-training
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEOFLORA_MONGODB_URI: ${{ secrets.GEOFLORA_MONGODB_URI }}
      GEOFLORA_RETRAIN_MIN_NEW: ${{ github.event.inputs.min_new || '20' }}
    defaults:
      run:
        working-directory: ml-lab
    steps:
      - name: Check secret
        id: secret
        working-directory: .
        run: |
          if [ -n "$GEOFLORA_MONGODB_URI" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::GEOFLORA_MONGODB_URI is not set; cloud training is skipped."; fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.secret.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-lab/requirements.txt
      - name: Install light dependencies
        if: steps.secret.outputs.ready == 'true'
        run: pip install "pymongo>=4.6,<5" "pandas>=2.0" "Pillow>=10.0"
      - name: Import approved photos and activate approved models
        id: quick
        if: steps.secret.outputs.ready == 'true'
        run: python scripts/cloud_training.py --no-train

      - name: Install training dependencies
        if: steps.quick.outputs.due == 'true'
        run: |
          pip install -r requirements.txt
          python -m venv /tmp/onnxenv
          /tmp/onnxenv/bin/pip install -q "tensorflow==2.20.0" "keras==3.15.1" tf2onnx onnx onnxruntime pillow
      - name: Retrain, evaluate and offer the new model
        id: train
        if: steps.quick.outputs.due == 'true'
        run: python scripts/cloud_training.py --onnx-python /tmp/onnxenv/bin/python

      - name: Commit and push changes
        if: steps.secret.outputs.ready == 'true'
        working-directory: .
        run: |
          git add ml-lab/metadata/image_manifest.csv ml-lab/metadata/nissap/split_assignments.csv apps/web/models
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "geoflora-cloud-training"
          git config user.email "geoflora-cloud-training@users.noreply.github.com"
          git commit -m "Cloud training: new report photos and/or an approved model"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
