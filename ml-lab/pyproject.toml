[project]
name = "geoflora-ml-lab"
version = "0.1.0"
description = "Standalone research workspace for the GeoFlora invasive alien plant identification model"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["slow: trains a tiny model end-to-end (about 1-3 minutes on CPU)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
