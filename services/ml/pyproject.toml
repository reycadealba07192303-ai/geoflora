[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflora-ml"
version = "0.1.0"
description = "GeoFlora invasive plant image collection and ML pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Pillow>=10.0,<12",
    "pymongo>=4.8,<5",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8.0,<9"]
inference = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]
# Hosted service (Hugging Face Space) downloads its model; the training computer uploads promoted models.
hosting = [
    "huggingface_hub>=0.26,<2",
]
training = [
    "numpy>=1.26,<2",
    "scikit-learn>=1.4,<2",
    "tensorflow>=2.16,<2.18",
]

[project.scripts]
geoflora-ml = "geoflora_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoflora_ml = ["species.yaml", "datasets/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
